plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def releaseStoreFile = file("release-key.jks")
def releaseStorePassword = System.getenv("RELEASE_STORE_PASSWORD")
def releaseKeyAlias = System.getenv("RELEASE_KEY_ALIAS")
def releaseKeyPassword = System.getenv("RELEASE_KEY_PASSWORD")
def hasReleaseSigning = releaseStoreFile.exists() &&
        releaseStorePassword &&
        releaseKeyAlias &&
        releaseKeyPassword

android {
    namespace 'com.studyhaven.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.theinvestigator.app'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile releaseStoreFile
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}
