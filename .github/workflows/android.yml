name: Build THE INVESTIGATOR APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Validate embedded JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path("app/src/main/assets/index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script>(.*?)</script>", html, re.S)
          if len(scripts) != 1:
              raise SystemExit(f"Expected one app script, found {len(scripts)}")
          Path("/tmp/investigator.js").write_text(scripts[0], encoding="utf-8")
          PY
          node --check /tmp/investigator.js
      - name: Validate app features and safeguards
        run: |
          node <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('app/src/main/assets/index.html', 'utf8');
          const manifest = fs.readFileSync('app/src/main/AndroidManifest.xml', 'utf8');
          const required = ['home','cases','detail','room','archive','profile','statistics','verdict','timer','settings'];
          for (const id of required) {
            if (!html.includes('id="' + id + '"')) throw new Error('Missing screen: ' + id);
          }
          for (const token of ['function statistics()', 'function markReviewed(', 'function saveTimer()', 'function restoreTimer()', 'function applyTheme(', 'function setSoundVolume(', 'function previewSounds(', 'function renameLesson(', 'function deleteLesson(', 'function deleteQuestion(', 'q.needsReview=true', 'investigatorSoundEnabled']) {
            if (!html.includes(token)) throw new Error('Missing feature: ' + token);
          }
          const names = [...html.matchAll(/function\s+([A-Za-z_$][\w$]*)\s*\(/g)].map(x => x[1]);
          const duplicates = names.filter((name, i) => names.indexOf(name) !== i);
          if (duplicates.length) throw new Error('Duplicate function declarations: ' + [...new Set(duplicates)].join(', '));
          if (!manifest.includes('android.permission.INTERNET')) throw new Error('HTTPS font permission missing');
          console.log('App feature and safeguard checks passed.');
          NODE
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: the-investigator-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Restore persistent release keystore
        if: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > app/release-key.jks
      - name: Build signed release APK
        if: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          test -s app/release-key.jks
          test -n "$RELEASE_STORE_PASSWORD"
          test -n "$RELEASE_KEY_ALIAS"
          test -n "$RELEASE_KEY_PASSWORD"
          gradle assembleRelease
      - name: Upload signed release APK
        if: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: the-investigator-signed-release-apk
          path: app/build/outputs/apk/release/app-release.apk
